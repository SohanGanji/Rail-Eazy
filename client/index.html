<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Rail Eazy • Transit Matrix</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Pixelify+Sans:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <!-- Tailwind CDN & Palette Config from Stitch -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "space-void": "#0c0816",
            "background": "#100c1a",
            "surface": "#15111f",
            "surface-container-lowest": "#100c1a",
            "surface-container-low": "#1e1928",
            "surface-container": "#221d2c",
            "surface-container-high": "#2c2837",
            "surface-container-highest": "#373242",
            "primary": "#d0bcff",
            "primary-container": "#7b51df",
            "on-primary-container": "#f6eeff",
            "violet-electric": "#7b51df",
            "violet-glow": "#9366ff",
            "violet-lavender": "#a28add",
            "violet-deep": "#3d1f85",
            "secondary-container": "#4f3885",
            "mint-emerald": "#10b981",
            "mint-glow": "#34d399",
            "amber-warning": "#f59e0b",
            "on-surface": "#e8dff4",
            "on-surface-variant": "#cbc3d6",
            "outline": "#948e9f"
          },
          fontFamily: {
            pixel: ['"Pixelify Sans"', 'cursive', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            sans: ['"Inter"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #0c0816;
      color: #e8dff4;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined' !important;
      font-size: 20px;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
  </style>
</head>

<body class="bg-space-void antialiased text-sm">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
